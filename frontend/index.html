<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PFIP turns raw bank statements into financial intelligence — categorized transactions, spending trends, a health score, budgets, a cash-flow forecast and an assistant grounded in your real data."
    />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="color-scheme" content="light dark" />
    <title>PFIP — Personal Finance Intelligence Platform</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Resolve the theme before first paint. Without this the app renders one
      // frame in light and repaints to dark, which reads as a flash on every
      // single navigation for dark-mode users.
      (function () {
        try {
          var stored = localStorage.getItem('pfip_theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : prefersDark ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', theme === 'dark' ? '#080b14' : '#f8fafc')
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
